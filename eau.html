<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiquidVM eau</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0e14;
        font-family: 'Cascadia Code', 'Consolas', monospace;
        color: #c6ccdc;
      }
      .hud {
        position: fixed;
        left: 16px;
        bottom: 16px;
        font-size: 13px;
        line-height: 1.8;
        background: rgba(14, 20, 30, 0.85);
        border: 1px solid rgba(110, 140, 180, 0.3);
        border-radius: 8px;
        padding: 12px 16px;
        user-select: none;
      }
      .hud b {
        color: #9fd0ff;
      }
      .pass {
        color: #7fe2a5;
        font-weight: 600;
      }
      .fail {
        color: #ff9a9a;
        font-weight: 600;
      }
      .fatal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #140a0e;
        color: #ffd7d7;
        font-size: 16px;
        padding: 40px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="hud" id="hud-eau">démarrage du banc…</div>
    <script type="module" src="/src/platform/web/main_eau.ts"></script>
  </body>
</html>
