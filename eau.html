<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiquidVM eau</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0e14;
        font-family: 'Cascadia Code', 'Consolas', monospace;
        color: #c6ccdc;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      .panel3d {
        position: fixed;
        top: 14px;
        right: 14px;
        width: 314px;
        max-height: calc(100vh - 28px);
        overflow-y: auto;
        background: rgba(14, 20, 30, 0.92);
        border: 1px solid rgba(110, 140, 180, 0.3);
        border-radius: 10px;
        padding: 12px 14px;
        color: #c6ccdc;
        font-size: 12px;
        user-select: none;
      }
      .panel3d.hidden {
        display: none;
      }
      .panel3d-title {
        color: #e8ebf5;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .panel3d-section {
        color: #8f97ad;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 10px;
        margin: 10px 0 4px;
        border-bottom: 1px solid rgba(110, 140, 180, 0.2);
        padding-bottom: 3px;
      }
      .panel3d-row {
        display: grid;
        grid-template-columns: 118px 1fr 52px;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }
      .panel3d-row input[type='range'] {
        width: 100%;
        accent-color: #5aa0e0;
      }
      .panel3d-value {
        text-align: right;
        color: #e8ebf5;
        font-variant-numeric: tabular-nums;
      }
      .panel3d-check {
        grid-template-columns: auto 1fr;
      }
      .panel3d-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0;
      }
      .panel3d-buttons button {
        background: rgba(40, 55, 75, 0.85);
        border: 1px solid rgba(110, 140, 180, 0.35);
        border-radius: 7px;
        color: #dfe4f0;
        font: inherit;
        padding: 6px 10px;
        cursor: pointer;
      }
      .panel3d-buttons button:hover {
        background: rgba(60, 80, 105, 0.9);
      }
      .hud {
        position: fixed;
        left: 16px;
        bottom: 16px;
        font-size: 13px;
        line-height: 1.8;
        background: rgba(14, 20, 30, 0.85);
        border: 1px solid rgba(110, 140, 180, 0.3);
        border-radius: 8px;
        padding: 12px 16px;
        user-select: none;
        /* Purement informatif : il ne doit pas voler les clics destinés au bac
           (la boule s'attrape jusqu'en bas de l'écran). */
        pointer-events: none;
      }
      .hud b {
        color: #9fd0ff;
      }
      .pass {
        color: #7fe2a5;
        font-weight: 600;
      }
      .fail {
        color: #ff9a9a;
        font-weight: 600;
      }
      .fatal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #140a0e;
        color: #ffd7d7;
        font-size: 16px;
        padding: 40px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas-eau"></canvas>
    <div class="hud" id="hud-eau">démarrage…</div>
    <script type="module" src="/src/platform/web/main_eau.ts"></script>
  </body>
</html>
