<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>LiquidVM — WebGPU fluids</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0d12;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
        touch-action: none;
      }
      #gpu-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
        touch-action: none;
      }
      .overlay {
        position: fixed;
        left: 12px;
        bottom: 74px;
        color: rgba(226, 233, 244, 0.92);
        font-size: 11px;
        line-height: 1.6;
        pointer-events: none;
        user-select: none;
        background: rgba(8, 10, 16, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 8px 12px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 50;
      }
      .overlay .hint {
        color: rgba(170, 180, 196, 0.75);
      }
      .panel {
        position: fixed;
        right: 12px;
        top: max(12px, env(safe-area-inset-top));
        width: 250px;
        color: rgba(226, 233, 244, 0.92);
        font-size: 11px;
        background: rgba(8, 10, 16, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 12px 14px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        user-select: none;
        z-index: 150;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        max-height: calc(100vh - 90px);
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      }
      .panel.hidden {
        display: none;
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .panel-title {
        color: rgba(170, 180, 196, 0.85);
        letter-spacing: 0.06em;
        font-weight: bold;
      }
      .panel-close-btn {
        background: none;
        border: none;
        color: rgba(226, 233, 244, 0.6);
        font-size: 18px;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 4px;
        line-height: 1;
      }
      .panel-close-btn:hover, .panel-close-btn:active {
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
      }
      .panel-row {
        display: grid;
        grid-template-columns: 82px 1fr 44px;
        align-items: center;
        gap: 6px;
        margin: 4px 0;
      }
      .panel-row input[type='range'] {
        width: 100%;
        accent-color: #6f8dff;
        height: 14px;
        cursor: pointer;
      }
      .panel-value {
        text-align: right;
        color: rgba(170, 180, 196, 0.9);
        font-variant-numeric: tabular-nums;
      }
      .panel-check {
        grid-template-columns: auto 1fr;
        margin-top: 8px;
        cursor: pointer;
      }
      .panel-check input {
        accent-color: #6f8dff;
        cursor: pointer;
      }
      .panel-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .panel-buttons button {
        flex: 1 1 70px;
        background: rgba(255, 255, 255, 0.07);
        color: inherit;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        font: inherit;
        padding: 6px 4px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .panel-buttons button:hover, .panel-buttons button:active {
        background: rgba(255, 255, 255, 0.16);
      }
      .panel-tools {
        margin: 2px 0 8px;
      }
      .panel-tools button {
        flex: 1 1 30%;
        font-size: 10px;
        padding: 5px 2px;
      }
      .panel-tools button.active {
        background: rgba(111, 141, 255, 0.32);
        border-color: rgba(111, 141, 255, 0.7);
        color: #fff;
        font-weight: bold;
      }

      /* Quick Toolbar Tactile */
      .mobile-toolbar {
        position: fixed;
        bottom: max(10px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: none;
        max-width: calc(100vw - 16px);
      }
      .toolbar-toggle-btn {
        pointer-events: auto;
        background: rgba(8, 10, 16, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        color: rgba(226, 233, 244, 0.85);
        font-size: 10px;
        padding: 3px 14px;
        cursor: pointer;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: all 0.2s ease;
      }
      .toolbar-toggle-btn:hover, .toolbar-toggle-btn:active {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
      }
      .toolbar-content {
        pointer-events: auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 6px;
        background: rgba(8, 10, 16, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 6px 10px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .toolbar-content::-webkit-scrollbar {
        display: none;
      }
      .mobile-toolbar.collapsed .toolbar-content {
        display: none;
      }
      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .toolbar-group:not(:last-child) {
        padding-right: 6px;
        border-right: 1px solid rgba(255, 255, 255, 0.12);
      }
      .toolbar-btn {
        background: rgba(255, 255, 255, 0.06);
        color: rgba(226, 233, 244, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        font: inherit;
        font-size: 11px;
        padding: 5px 8px;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s ease;
        touch-action: manipulation;
        min-height: 28px;
      }
      .toolbar-btn:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      .toolbar-btn:active {
        transform: scale(0.96);
      }
      .toolbar-btn.active {
        background: rgba(111, 141, 255, 0.32);
        border-color: rgba(111, 141, 255, 0.7);
        color: #fff;
        font-weight: bold;
      }
      .fluid-btn-0.active {
        background: rgba(38, 140, 255, 0.35);
        border-color: rgba(38, 140, 255, 0.8);
      }
      .fluid-btn-1.active {
        background: rgba(217, 64, 242, 0.35);
        border-color: rgba(217, 64, 242, 0.8);
      }
      .fluid-btn-2.active {
        background: rgba(255, 222, 158, 0.35);
        border-color: rgba(255, 222, 158, 0.8);
      }
      .fluid-btn-3.active {
        background: rgba(255, 120, 40, 0.4);
        border-color: rgba(255, 120, 40, 0.9);
      }

      .tool-preview {
        position: fixed;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 30;
        border-radius: 50%;
      }
      .tool-preview.hidden {
        display: none;
      }

      .hand-cursor {
        position: fixed;
        width: 28px;
        height: 28px;
        border: 2.5px solid rgba(140, 175, 255, 0.95);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 40;
        box-shadow: 0 0 12px rgba(140, 175, 255, 0.5);
        transition: background-color 0.08s ease;
      }
      .hand-cursor.pinch {
        background: rgba(160, 190, 255, 0.55);
        border-color: #fff;
      }
      .hand-cursor.hidden {
        display: none;
      }
      .fatal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e8ecf4;
        background: #14161d;
        padding: 24px;
        text-align: center;
        font-size: 15px;
        line-height: 1.8;
        z-index: 1000;
      }
      .fatal code {
        color: #8ab4ff;
      }

      /* Responsive Mobile */
      @media (max-width: 768px) {
        .overlay {
          left: 8px;
          top: max(8px, env(safe-area-inset-top));
          bottom: auto;
          font-size: 10px;
          padding: 6px 10px;
          max-width: calc(100vw - 16px);
          line-height: 1.4;
        }
        .hint-desktop {
          display: none;
        }
        .hint-touch {
          display: block;
        }
        .panel {
          right: 8px;
          top: max(8px, env(safe-area-inset-top));
          width: calc(100vw - 16px);
          max-width: 320px;
          max-height: calc(100vh - 110px);
          font-size: 11px;
        }
        .toolbar-content {
          gap: 4px;
          padding: 4px 6px;
        }
        .toolbar-group:not(:last-child) {
          padding-right: 4px;
        }
        .toolbar-btn {
          padding: 4px 6px;
          font-size: 10px;
          min-height: 26px;
        }
      }
      @media (min-width: 769px) {
        .hint-touch {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="gpu-canvas"></canvas>
    <script type="module" src="/src/platform/web/main.ts"></script>
  </body>
</html>
